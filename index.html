<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UNSTABLE LIFE</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body{
      background:#050505;
      overflow-x:hidden;
      font-family:Arial, Helvetica, sans-serif;
    }

    .glow{
      text-shadow:
      0 0 10px #00ff88,
      0 0 20px #00ff88,
      0 0 40px #00ff88;
    }

    .glass{
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.08);
    }

    .pulse{
      animation:pulse 2s infinite;
    }

    @keyframes pulse{
      0%{transform:scale(1);}
      50%{transform:scale(1.03);}
      100%{transform:scale(1);}
    }

    .bg-grid{
      position:fixed;
      width:100%;
      height:100%;
      top:0;
      left:0;
      background-image:
      linear-gradient(rgba(0,255,100,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,100,0.05) 1px, transparent 1px);
      background-size:40px 40px;
      z-index:-1;
    }
  </style>
</head>
<body class="text-white">

<div class="bg-grid"></div>

<section class="min-h-screen flex flex-col items-center justify-center text-center px-6">

  <div class="glass rounded-3xl p-10 max-w-4xl w-full shadow-2xl">

    <h1 class="text-6xl md:text-8xl font-black glow mb-6">
      UNSTABLE LIFE
    </h1>

    <p class="text-gray-300 text-xl md:text-2xl mb-8">
      Chaos. Memes. Degeneracy.
    </p>

    <img
      src="https://media.tenor.com/6ZUs587m8WQAAAAC/wojak.gif"
      class="rounded-3xl mx-auto mb-8 w-full max-w-md border border-green-500"
    />

    <div class="flex flex-wrap justify-center gap-4 mb-10">

      <a href="#buy"
        class="bg-green-500 hover:bg-green-400 transition px-8 py-4 rounded-2xl text-black font-bold pulse">
        BUY NOW
      </a>

      <a href="https://dexscreener.com/"
        target="_blank"
        class="glass hover:bg-white/10 transition px-8 py-4 rounded-2xl font-bold">
        CHART
      </a>

      <a href="https://t.me/"
        target="_blank"
        class="glass hover:bg-white/10 transition px-8 py-4 rounded-2xl font-bold">
        TELEGRAM
      </a>

    </div>

    <div class="grid md:grid-cols-3 gap-5">

      <div class="glass rounded-2xl p-6">
        <h2 class="text-3xl font-black text-green-400 mb-2">
          0%
        </h2>
        <p class="text-gray-400">
          Utility
        </p>
      </div>

      <div class="glass rounded-2xl p-6">
        <h2 class="text-3xl font-black text-green-400 mb-2">
          100%
        </h2>
        <p class="text-gray-400">
          Delusion
        </p>
      </div>

      <div class="glass rounded-2xl p-6">
        <h2 class="text-3xl font-black text-green-400 mb-2">
          ∞
        </h2>
        <p class="text-gray-400">
          Possibility
        </p>
      </div>

    </div>

  </div>

</section>

<section class="px-6 pb-20" id="buy">

  <div class="max-w-5xl mx-auto glass rounded-3xl p-6">

    <h2 class="text-4xl font-black mb-6 text-center glow">
      LIVE CHART
    </h2>

    <iframe
      src="https://dexscreener.com/solana/PASTEYOURTOKENADDRESSHERE?embed=1&theme=dark"
      width="100%"
      height="600"
      style="border:0;border-radius:20px;">
    </iframe>

  </div>

</section>

<footer class="text-center text-gray-500 pb-10">
  Built for absolute market survivors.
</footer>

</body>
</html>
